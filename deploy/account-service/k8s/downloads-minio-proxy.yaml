# Public GET for https://anycode.work/downloads/<file>
# → MinIO path-style s3://downloads/<file> (same cluster as FDE courses).
#
# SPA page stays on the account pod at /downloads (no extra path segment).
# Ingress-nginx cannot resolve ExternalName DNS here, so we pin MinIO's ClusterIP.
---
apiVersion: v1
kind: Service
metadata:
  name: minio-downloads
  namespace: dis-cloud
  labels:
    app: anycode-downloads
spec:
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: minio-downloads
  namespace: dis-cloud
  labels:
    app: anycode-downloads
subsets:
  - addresses:
      # kubectl -n base-service get svc minio -o jsonpath='{.spec.clusterIP}'
      - ip: 10.43.251.186
    ports:
      - name: s3
        port: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: anycode-downloads
  namespace: dis-cloud
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/upstream-vhost: minio.base-service.svc.cluster.local
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  tls:
    - hosts:
        - anycode.work
      secretName: anycode-ssl
  rules:
    - host: anycode.work
      http:
        paths:
          - path: /downloads/.+
            pathType: ImplementationSpecific
            backend:
              service:
                name: minio-downloads
                port:
                  number: 9000

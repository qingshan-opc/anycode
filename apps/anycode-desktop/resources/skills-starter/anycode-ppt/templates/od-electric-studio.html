<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OD Electric Studio</title>
  <style>
    :root{--bg:#111;--ink:#fff;--accent:#fff;--ink-60:rgba(255,255,255,.72);--ink-40:rgba(255,255,255,.55);
      --serif:Georgia,serif;--sans:"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;position:relative}

    :root{--bg:#05060a;--ink:#111;--accent:#1d4ed8}
    body{background:var(--bg)}
    .top{position:absolute;left:0;right:0;top:0;height:50%;background:#fff;color:#111;padding:96px}
    .bot{position:absolute;left:0;right:0;bottom:0;height:50%;background:var(--accent);color:#fff;padding:96px}
    .top h1,.bot h1{font:700 64px/1.15 var(--sans);max-width:1400px}
    .meta{position:absolute;left:96px;bottom:48px;font:600 18px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#fff;opacity:.85}

  </style>
</head>
<body>

  <div class="top"><h1>“用一句可引用的话<br>占满上半屏。”</h1></div>
  <div class="bot"><h1>下半屏写作者 / 角色 / 产品一句定位。</h1></div>
  <div class="meta">Electric Studio</div>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OD Creative Voltage</title>
  <style>
    :root{--bg:#111;--ink:#fff;--accent:#fff;--ink-60:rgba(255,255,255,.72);--ink-40:rgba(255,255,255,.55);
      --serif:Georgia,serif;--sans:"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;position:relative}

    :root{--bg:#0a0f1c;--ink:#e8eefc;--accent:#5eead4}
    body{background:var(--bg);color:var(--ink)}
    .panel{position:absolute;left:0;top:0;bottom:0;width:48%;background:#1a2744}
    .script{position:absolute;left:10%;top:38%;font:700 96px/1 cursive;color:var(--accent)}
    .right{position:absolute;left:54%;top:32%;right:8%}
    .right h1{font:700 64px/1.1 var(--sans);letter-spacing:-.03em;margin-bottom:24px}
    .right p{font:400 26px/1.5 var(--sans);opacity:.8;max-width:620px}

  </style>
</head>
<body>

  <div class="panel"></div>
  <div class="script">V~</div>
  <div class="right"><h1>能量感标题</h1><p>左电蓝分屏 + 手写强调是签名；右侧只放一句主张与短说明。</p></div>

</body>
</html>

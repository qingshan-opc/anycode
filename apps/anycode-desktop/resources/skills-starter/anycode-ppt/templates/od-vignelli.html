<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OD Vignelli</title>
  <style>
    :root{--bg:#111;--ink:#fff;--accent:#fff;--ink-60:rgba(255,255,255,.72);--ink-40:rgba(255,255,255,.55);
      --serif:Georgia,serif;--sans:"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;position:relative}

    :root{--bg:#fff;--ink:#111;--accent:#e30613}
    body{background:var(--bg);color:var(--ink)}
    .bar{position:absolute;left:110px;top:200px;width:220px;height:14px;background:var(--accent)}
    h1{position:absolute;left:110px;top:260px;font:700 96px/1 Helvetica,Arial,sans-serif;letter-spacing:.04em;text-transform:uppercase}
    p{position:absolute;left:110px;top:420px;max-width:1100px;font:400 32px/1.45 Helvetica,Arial,sans-serif}
    .footer{position:absolute;left:110px;bottom:96px;font:600 18px/1 Helvetica,Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase}

  </style>
</head>
<body>

  <div class="bar"></div>
  <h1>Vignelli</h1>
  <p>红条 + 无衬线大写是签名。短句，留白，不要装饰插画。</p>
  <div class="footer">New York · Milano</div>

</body>
</html>

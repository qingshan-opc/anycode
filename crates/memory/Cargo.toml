[package]
name = "anycode-memory"
version.workspace = true
edition.workspace = true

[dependencies]
anycode-core = { path = "../core" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
dirs = "5"
aes-gcm = "0.10"
base64 = "0.22"
sha2 = "0.10"
fastembed = { version = "5", optional = true }

# Database
# sled 已停维护（DATA-02）：默认构建不含 sled；仅一次性迁移路径在 `sled-migrate` feature 下编译。
sled = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }

# File I/O
walkdir = "2.4"
ignore = "0.4"

# Caching
moka = { workspace = true, features = ["future"] }

[features]
default = ["sqlite"]
sqlite = ["dep:sqlx"]
# 旧 sled 热层 → sqlite 的一次性迁移；发布构建如需迁移存量数据，显式打开此 feature。
sled-migrate = ["dep:sled", "sqlite"]
# 本地 ONNX 嵌入（FastEmbed / MiniLM），需 `cargo build -p anycode-desktop --features embedding-local`。
embedding-local = ["dep:fastembed"]
# 预留：接入 LanceDB / 远端向量索引时启用，与 `EmbeddingProvider` + `VectorMemoryBackend` 实现联用。
memory-vector = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OD Build Minimal</title>
  <style>
    :root{--bg:#111;--ink:#fff;--accent:#fff;--ink-60:rgba(255,255,255,.72);--ink-40:rgba(255,255,255,.55);
      --serif:Georgia,serif;--sans:"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;position:relative}

    :root{--bg:#faf8f4;--ink:#222;--accent:#c9a227}
    body{background:var(--bg);color:var(--ink)}
    .word{position:absolute;left:120px;top:42%;font:200 120px/1 Helvetica,Arial,sans-serif;letter-spacing:.28em}
    .line{position:absolute;left:120px;top:58%;width:360px;height:2px;background:var(--accent)}
    .cap{position:absolute;left:120px;top:64%;font:400 24px/1.4 var(--sans);opacity:.55;max-width:720px}

  </style>
</head>
<body>

  <div class="word">build</div>
  <div class="line"></div>
  <p class="cap">一个词 + 暖金细线。不要堆图标，不要改成浓彩。</p>

</body>
</html>

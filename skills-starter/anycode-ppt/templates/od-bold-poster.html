<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OD Bold Poster</title>
  <style>
    :root{--bg:#111;--ink:#fff;--accent:#fff;--ink-60:rgba(255,255,255,.72);--ink-40:rgba(255,255,255,.55);
      --serif:Georgia,serif;--sans:"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;position:relative}

    :root{--bg:#F5F2EF;--ink:#1C1410;--accent:#D8000F}
    body{background:var(--bg);color:var(--ink)}
    .kicker{position:absolute;top:92px;left:110px;right:110px;display:flex;align-items:center;gap:28px}
    .kicker .label{font:700 22px/1 var(--mono);letter-spacing:6px;text-transform:uppercase}
    .kicker .rule{flex:1;height:3px;background:var(--accent)}
    .kicker .date{font:500 22px/1 var(--mono);letter-spacing:3px;text-transform:uppercase}
    .figure{position:absolute;top:150px;right:96px;font-family:var(--serif);font-weight:900;font-size:320px;line-height:.8;color:var(--accent);transform:rotate(-6deg)}
    .head{position:absolute;left:110px;bottom:300px;font-family:var(--serif);font-weight:900;line-height:.9}
    .head .ln{display:block;font-size:120px}
    .head .ln2{color:var(--accent)}
    .stand{position:absolute;left:114px;bottom:200px;max-width:980px;font-family:var(--serif);font-style:italic;font-size:34px;line-height:1.4}
    .footer{position:absolute;left:110px;right:110px;bottom:96px}
    .footer .rule{height:2px;background:var(--ink)}
    .footer .meta{display:flex;justify-content:space-between;margin-top:18px;font:500 18px/1 var(--mono);letter-spacing:3px;text-transform:uppercase}

  </style>
</head>
<body>

  <div class="kicker"><span class="label">Manifesto</span><span class="rule"></span><span class="date">Vol. 01</span></div>
  <div class="figure">03</div>
  <div class="head"><span class="ln">Make it</span><span class="ln ln2">loud.</span><span class="ln">Make it last.</span></div>
  <p class="stand">用真实题目替换这三行标题与副题；保持番红只出现在 rule / figure / 中间行。</p>
  <div class="footer"><div class="rule"></div><div class="meta"><span>Bold Poster</span><span>anycode-ppt</span></div></div>

</body>
</html>

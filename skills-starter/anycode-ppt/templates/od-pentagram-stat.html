<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OD Pentagram Stat</title>
  <style>
    :root{--bg:#111;--ink:#fff;--accent:#fff;--ink-60:rgba(255,255,255,.72);--ink-40:rgba(255,255,255,.55);
      --serif:Georgia,serif;--sans:"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;position:relative}

    :root{--bg:#111;--ink:#fff;--accent:#fff}
    body{background:var(--bg);color:var(--ink)}
    .num{position:absolute;left:80px;top:180px;font:900 320px/0.85 Helvetica,Arial,sans-serif;letter-spacing:-.06em}
    .label{position:absolute;left:110px;top:560px;font:600 28px/1.3 var(--sans);max-width:900px;opacity:.85}
    .rules{position:absolute;left:110px;right:110px;bottom:160px}
    .rules i{display:block;height:1px;background:#333;margin:28px 0}
    .kicker{position:absolute;left:110px;top:96px;font:700 16px/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.5}

  </style>
</head>
<body>

  <div class="kicker">Statistic</div>
  <div class="num">42%</div>
  <p class="label">用真实指标替换数字；网格细线与出血巨数字是签名。</p>
  <div class="rules"><i></i><i></i><i></i></div>

</body>
</html>

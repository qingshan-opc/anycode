<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>OD Bold Signal</title>
  <style>
    :root{--bg:#111;--ink:#fff;--accent:#fff;--ink-60:rgba(255,255,255,.72);--ink-40:rgba(255,255,255,.55);
      --serif:Georgia,serif;--sans:"PingFang SC",sans-serif;--mono:ui-monospace,monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden;position:relative}

    :root{--bg:#0e1117;--ink:#f5f5f7;--accent:#ff7a3d}
    body{background:var(--bg);color:var(--ink)}
    .num{position:absolute;right:96px;top:80px;font:900 160px/1 var(--sans);color:var(--accent);opacity:.95}
    .nav{position:absolute;left:96px;top:96px;font:600 20px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.55}
    .card{position:absolute;left:520px;top:180px;right:96px;bottom:140px;background:var(--accent);color:#111;padding:72px 64px;border-radius:12px}
    .card h1{font:800 72px/1.1 var(--sans);letter-spacing:-.03em;margin-bottom:28px}
    .card p{font:500 28px/1.45 var(--sans);max-width:820px}

  </style>
</head>
<body>

  <div class="nav">Section / 01</div>
  <div class="num">01</div>
  <div class="card"><h1>章节标题放这里</h1><p>暗底 + 橙色色块是签名；正文用黑字，不要改成蓝绿。</p></div>

</body>
</html>

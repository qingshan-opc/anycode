name: Harness integration preparation

on:
  push:
    branches: [refactor/harness-v1-merge-20260918]

permissions:
  contents: read

concurrency:
  group: harness-integration-prepare
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'qingshan-opc/anycode' && github.event_name == 'push' && github.ref == 'refs/heads/refactor/harness-v1-merge-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Hash-guarded wiring, targeted formatting and lock resolution
        run: python3 tools/harness/prepare_merge.py
      - name: Commit only to the review branch (never main, never force)
        id: commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BRANCH=refactor/harness-v1-merge-20260918
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git config --local user.name 'anycode-harness-ci'
          git config --local user.email 'anycode-harness-ci@users.noreply.github.com'
          git add -- Cargo.toml Cargo.lock crates/agent/Cargo.toml crates/agent/src/lib.rs crates/agent/src/runtime/mod.rs crates/agent/src/runtime/harness_bridge.rs crates/harness-core crates/harness-extensions crates/harness-host crates/harness-cloud818 crates/dashboard-ui/package.json
          if ! git diff --cached --quiet; then
            git commit -m 'build(harness): wire opt-in host, format Rust and resolve lockfile'
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  rust:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANYCODE_SKIP_BROWSER_SMOKE: '1'
      ANYCODE_BUILD_DASHBOARD_UI: '0'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Foundation and native host tests
        run: cargo test --locked -p anycode-harness-core -p anycode-harness-extensions -p anycode-harness-cloud818 -p anycode-harness-host
      - name: Existing agent with opt-in bridge
        run: cargo check --locked -p anycode-agent --features harness-v1
      - name: Clippy for the four new crates
        run: cargo clippy --locked -p anycode-harness-core -p anycode-harness-extensions -p anycode-harness-cloud818 -p anycode-harness-host --all-targets -- -D warnings
      - name: Scripted fixture (not a live-model test)
        run: cargo run --locked -p anycode-harness-core --example scripted_run

  dashboard-ui:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/dashboard-ui/package-lock.json
      - name: Install, run existing and new tests, and build UI
        working-directory: crates/dashboard-ui
        run: npm ci && npm test && npm run build
